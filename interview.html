    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      radial-gradient(circle at 15% 10%, #CFE8DF 0%, transparent 42%),
      radial-gradient(circle at 88% 22%, #FBE3C2 0%, transparent 38%),
      radial-gradient(circle at 30% 92%, #D9E4F5 0%, transparent 45%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
 
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:22px;flex-wrap:wrap;gap:14px;
  }
  .brand-eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--teal);text-transform:uppercase;margin-bottom:4px;font-weight:600;
  }
  h1{font-size:22px;font-weight:900;margin:0;letter-spacing:-.01em;}
  .role-tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line);}
  .role-tab{
    border:none;background:transparent;padding:9px 14px;border-radius:9px;
    font-family:var(--sans);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;
    transition:all .15s;
  }
  .role-tab.active{background:var(--ink);color:#fff;}
  .role-tab:hover:not(.active){background:var(--bg);color:var(--ink);}
 
  .card{
    background:var(--card);border:1.5px solid #D8DDE6;border-radius:16px;
    padding:22px 22px;margin-bottom:20px;
    box-shadow:0 2px 10px rgba(22,35,63,.06);
  }
  /* 지원자 카드(.candidate)는 뒤에 비치는 배경이 있어야 유리 효과가 보이므로,
     그 카드들을 담는 상위 컨테이너는 배경을 없애서 페이지의 그라데이션이 그대로 비치게 함. */
  .card.card-glass-host{background:transparent;border:none;box-shadow:none;padding-left:0;padding-right:0;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .card-title{font-size:15px;font-weight:700;margin:0;}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
 
  .btn{
    font-family:var(--sans);font-weight:700;font-size:13px;border-radius:9px;
    padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--ink);}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:#0e1730;}
  .btn-teal{background:var(--teal);color:#fff;border-color:var(--teal);}
  .btn-teal:hover{background:#256657;}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn-danger:hover{background:#FBEDEA;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
 
  .upload-zone{
    border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center;
    background:var(--bg);cursor:pointer;transition:all .15s;
  }
  .upload-zone:hover{border-color:var(--teal);background:var(--teal-soft);}
  .upload-zone input{display:none;}
  .upload-zone .icon{font-size:26px;margin-bottom:6px;}
  .upload-zone .txt{font-weight:700;font-size:13.5px;}
  .upload-zone .sub{font-size:12px;color:var(--muted);margin-top:4px;}
 
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);font-weight:600;
    padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  }
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line);}
  .table-wrap table{margin:0;}
  .table-wrap th:first-child, .table-wrap td:first-child{padding-left:14px;}
 
  .name-cell{font-weight:700;}
  .sub-cell{color:var(--muted);font-size:12px;white-space:normal;}
 
  .cell-label{
    font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;
  }
  .score-cell-grid{display:flex;flex-wrap:wrap;gap:4px 8px;font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-bottom:2px;}
 
  select.grade-select{
    font-family:var(--mono);font-weight:600;font-size:13px;
    border:1px solid var(--line);border-radius:7px;padding:5px 6px;
    background:var(--bg);color:var(--ink);cursor:pointer;
  }
  select.grade-select:focus{outline:2px solid var(--teal);outline-offset:1px;}
 
  .avg-pill{
    font-family:var(--mono);font-weight:600;font-size:13px;
    background:var(--teal-soft);color:var(--teal);padding:4px 9px;border-radius:7px;
    display:inline-block;
  }
  .avg-pill.empty{background:var(--bg);color:var(--muted);}
 
 
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .status-dot.done{background:var(--teal);}
  .status-dot.pending{background:var(--line);}
 
  .banner{
    display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;
    font-size:12.5px;line-height:1.5;
  }
  .banner.info{background:var(--teal-soft);color:#1F5A4C;border:1px solid rgba(47,125,107,.22);}
  .banner.warn{background:var(--amber-soft);color:#8A5316;border:1px solid rgba(201,122,43,.22);}
 
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}
 
  .hero-panel{
    position:relative;border-radius:20px;overflow:hidden;
    min-height:440px;display:flex;align-items:center;margin-bottom:20px;
    background-image:var(--hero-photo);background-size:cover;background-position:center 30%;
  }
  .hero-panel::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(100deg, rgba(10,14,24,.72) 0%, rgba(10,14,24,.35) 55%, rgba(10,14,24,.15) 100%);
  }
  .hero-box{
    position:relative;z-index:1;
    background:rgba(10,14,24,.72);backdrop-filter:blur(6px);
    border-radius:16px;padding:40px;max-width:540px;margin:24px 24px 24px 40px;
  }
  .hero-title{
    font-size:27px;font-weight:900;color:#fff;letter-spacing:-.01em;margin-bottom:8px;
  }
  .hero-subtitle{
    font-size:14px;font-weight:600;color:#5FBDA8;margin-bottom:20px;line-height:1.5;
  }
  .hero-divider{
    width:34px;height:2px;background:var(--teal);margin:0 0 18px;border-radius:2px;
  }
  .hero-desc{
    font-size:13.5px;line-height:1.8;color:rgba(255,255,255,.82);margin:0 0 22px;
  }
  .hero-cta{
    font-size:13px;color:rgba(255,255,255,.92);font-weight:600;margin:0;
  }
 
  .filter-input{
    font-family:var(--sans);font-size:13px;padding:8px 12px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);width:200px;
  }
  .filter-input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .memo-input{
    width:160px;min-width:140px;font-family:var(--sans);font-size:12px;
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;
    background:var(--bg);color:var(--ink);resize:vertical;line-height:1.4;
  }
  .memo-input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .memo-input::placeholder{color:var(--muted);}
 
  /* ---- 지원자 카드 (표 대신 카드 단위로 지원자를 훑어보는 UI) ----
     지원자가 많을 때 카드가 수십~수백 개 한꺼번에 그려지므로, backdrop-filter 블러 강도를
     가볍게 낮춰서(18px→8px, saturate 제거) 렌더링 부담을 줄였다. 유리 느낌은 배경 불투명도를
     살짝 올려서 보완. */
  .candidate{
    position:relative;border-radius:24px;overflow:hidden;display:flex;align-items:stretch;
    background:rgba(255,255,255,.58);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 1px 1px rgba(255,255,255,.8) inset, 0 20px 40px -14px rgba(22,35,63,.18);
    margin-bottom:24px;
  }
  .candidate::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
  }
  .candidate:last-child{margin-bottom:0;}
  .cand-main{flex:1;min-width:0;}
  .cand-head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px;}
  .cand-id{flex:1;min-width:0;}
  .cand-name-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .cand-name{font-size:16px;font-weight:800;}

  /* 경력이 많으면 가로 스크롤 대신 다음 줄로 자동으로 넘어가야 하는데, flexbox의

  /* On narrow screens, tables with many columns (score entry, rankings) switch from a

<body>
<div id="app"></div>
 
<script>
(function(){
  const GRADE_MAP = { 'A':100, 'B+':95, 'B':90, 'C':80, 'D':70, 'E':0 };
  const GRADES = ['A','B+','B','C','D','E'];
  const GRADE_DEFINITIONS = {
    'A': '기대수준 이상',
    'B+': '기대 수준에 부합함',
    'B': '대부분 부합하지만 일부 부족함',
    'C': '근거를 찾을 수 없음',
    'D': '부합하지 않음',
    'E': '불참석',
  };
  const INTERVIEWERS_ALL = ['A','B','C','D','E']; // 최대 5명까지 지원
 
  let state = {
    role: null,
    adminSubPage: 'main', // 'main' | 'changelog'
    pendingRole: null,
    pinInput: '',
    pinError: '',
    pins: { admin:'0000', A:'1111', B:'2222', C:'3333', D:'4444', E:'5555' },
    rounds: [],            // [{id, name, createdAt}] — 지금까지 있었던 모든 면접 회차
    activeRoundId: null,   // 면접관들이 지금 채점하고 있는 회차 (관리자가 지정)
    viewRoundId: null,     // 관리자가 현재 화면에서 들여다보고 있는 회차 (과거 회차 조회 가능)
    candidates: [],
    scores: { A:{}, B:{}, C:{}, D:{}, E:{} },
    interviewerNames: { A:'', B:'', C:'', D:'', E:'' }, // 회차마다 바뀌는 실제 면접관 이름
    revealed: false,
    filter: '',
    ownRankingExpanded: false, // '나의 실시간 순위'는 기본적으로 접혀있음
    visibleCounts: {}, // 목록별로 지금까지 "더 보기"로 펼친 개수 (지원자 많을 때 초기 렌더링 부담 완화)
    loaded: false,
    saving: false,
  };
 
  const app = document.getElementById('app');
  function roundKey(roundId, base){ return `round:${roundId}:${base}`; }
 
  // The round whose candidates/scores should currently be shown:
  // - Interviewers always follow whatever round the admin marked "active".
  // - The admin can browse a different (past) round without disturbing what
  //   interviewers see, via viewRoundId.
  function currentRoundId(){
    return state.role === 'admin' ? (state.viewRoundId || state.activeRoundId) : state.activeRoundId;
  }
 
  // 면접관은 보통 3명이지만 회차에 따라 2~5명일 수 있음. 회차 메타데이터(interviewerCount)에서
  // 읽어오고, 없거나 잘못된 값이면 기본값 3으로 처리.
  function getInterviewerCount(roundId){
    const r = state.rounds.find(x => x.id === roundId);
    const n = r && r.interviewerCount;
    return (n >= 2 && n <= 5) ? n : 3;
  }
  function activeInterviewerLetters(roundId){
    return INTERVIEWERS_ALL.slice(0, getInterviewerCount(roundId));
  }
  // 채점 기준: 'dual'(기본) = 직무적합도+조직적합도 각각 평가, 'single' = 등급 하나로만 종합평가.
  // 예전에 만든 회차는 이 필드가 없으므로 기본값 'dual'로 처리(하위 호환).
  function getScoringMode(roundId){
    const r = state.rounds.find(x => x.id === roundId);
    return (r && r.scoringMode === 'single') ? 'single' : 'dual';
  }
 
  // ---------- storage helpers ----------
  // Backed by a Google Apps Script web app that reads/writes a Google Sheet, so it works
  // whether this page is opened inside Claude.ai, downloaded and opened locally, or hosted
  // anywhere (GitHub Pages, etc.) — every device just talks to the same spreadsheet.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwgJkN_pU6UvX-tSgVkVGSZWtCQQ8jsy01zHmLjhMDXIJAZ6NWqmv-_cbse25d1xxVpVA/exec';
  // Must exactly match SECRET_TOKEN in the Apps Script code — anyone with both this file
  // and the token can read/write the sheet, so don't publish this file publicly as-is.
  const SECRET_TOKEN = 'ffc4717c87628ccae6cf0bdd2e8cefcef3bb5e9e2a280e5c';
 
  // getShared returns { ok:true, value } on a genuine read, or { ok:false } if the read
  // failed / key doesn't exist yet. Callers should NOT blindly overwrite good local state
  // with a failed read — that was the bug causing uploaded data to "disappear" on the
  // next auto-refresh.
  async function getShared(key){
    try{
      const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(SECRET_TOKEN)}`);
      const data = await res.json();
      if(!data.ok) return { ok:false };
      return { ok:true, value: JSON.parse(data.value) };
    }catch(e){ return { ok:false }; }
  }
 
  // Fetches several keys in ONE request instead of one request per key — Apps Script web
  // apps have noticeable per-request overhead, and issuing many of them (even in parallel)
  // was the main reason the app felt slow to open. Returns { [key]: {ok, value} }.
  async function getSharedBatch(keys){
    const fallback = {};
    keys.forEach(k => { fallback[k] = { ok:false }; });
    try{
      const res = await fetch(`${API_URL}?action=getBatch&keys=${encodeURIComponent(keys.join(','))}&token=${encodeURIComponent(SECRET_TOKEN)}`);
      const data = await res.json();
      if(!data.ok || !data.values) return fallback;
      const out = {};
      keys.forEach(k=>{
        if(Object.prototype.hasOwnProperty.call(data.values, k)){
          try{ out[k] = { ok:true, value: JSON.parse(data.values[k]) }; }
          catch(e){ out[k] = { ok:false }; }
        } else {
          out[k] = { ok:false };
        }
      });
      return out;
    }catch(e){ return fallback; }
  }
 
  async function setShared(key, value, tries=3){
    for(let i=0;i<tries;i++){
      try{
        // Content-Type: text/plain avoids triggering a CORS preflight (which Apps
        // Script web apps don't handle) — the body is still valid JSON underneath;
        // doPost() on the script side parses it manually.
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action:'set', key, value: JSON.stringify(value), token: SECRET_TOKEN }),
        });
        const data = await res.json();
        if(data.ok) return true;
      }catch(e){ console.error('storage set failed', key, e); }
      await new Promise(r=>setTimeout(r, 350));
    }
    return false;
  }
 
  // Snapshot of everything that would affect what's on screen, so the 3-second background
  // sync only triggers a full re-render when something has actually changed. Without this,
  // every poll rebuilt the entire page from scratch even when nothing was new — which got
  // noticeably slower as more cards/tables were added over time.
  let lastRenderSnapshot = null;
  function takeRenderSnapshot(){
    return JSON.stringify({
      role: state.role, pendingRole: state.pendingRole, adminSubPage: state.adminSubPage,
      rounds: state.rounds, activeRoundId: state.activeRoundId, viewRoundId: state.viewRoundId,
      candidates: state.candidates, scores: state.scores, revealed: state.revealed,
      interviewerNames: state.interviewerNames, filter: state.filter, pins: state.pins,
    });
  }
 
  async function loadAll(){
    const meta = await getSharedBatch(['rounds', 'activeRoundId', 'pins']);
    if(meta.rounds.ok) state.rounds = meta.rounds.value || [];
    if(meta.activeRoundId.ok) state.activeRoundId = meta.activeRoundId.value || null;
    if(meta.pins.ok && meta.pins.value) state.pins = { ...state.pins, ...meta.pins.value };
    if(!state.viewRoundId) state.viewRoundId = state.activeRoundId;
 
    const rid = currentRoundId();
    if(!rid){
      state.candidates = [];
      state.scores = { A:{}, B:{}, C:{} };
      state.interviewerNames = { A:'', B:'', C:'' };
      state.revealed = false;
      state.loaded = true;
      const snap = takeRenderSnapshot();
      if(snap !== lastRenderSnapshot){ lastRenderSnapshot = snap; render(); }
      return;
    }
    const scoreKeys = INTERVIEWERS_ALL.map(l => roundKey(rid, 'scores_' + l));
    const roundData = await getSharedBatch([
      roundKey(rid,'candidates'),
      ...scoreKeys,
      roundKey(rid,'revealed'),
      roundKey(rid,'interviewerNames'),
    ]);
    const cand = roundData[roundKey(rid,'candidates')];
    const rev = roundData[roundKey(rid,'revealed')];
    const names = roundData[roundKey(rid,'interviewerNames')];
    // Only apply a key if the read actually succeeded — on failure, keep whatever
    // is already showing instead of wiping it out with an empty fallback.
    if(cand.ok) state.candidates = cand.value || [];
    // Never let the background poll overwrite the score set the CURRENT interviewer is
    // actively editing — only that interviewer writes to this key, so the local copy is
    // already the freshest truth. Overwriting it with a server read risked clobbering a
    // just-made selection before the write had fully landed (the "grade disappears right
    // after picking it" bug). Other interviewers' / admin's own polls are unaffected.
    INTERVIEWERS_ALL.forEach(letter=>{
      const s = roundData[roundKey(rid, 'scores_' + letter)];
      if(s.ok && state.role !== letter) state.scores[letter] = s.value || {};
    });
    if(rev.ok) state.revealed = !!rev.value;
    if(names.ok && names.value){
      const merged = { A:'', B:'', C:'', D:'', E:'', ...names.value };
      if(INTERVIEWERS_ALL.includes(state.role)){
        merged[state.role] = state.interviewerNames[state.role]; // 본인이 방금 입력한 이름은 서버값으로 덮어쓰지 않음
      }
      state.interviewerNames = merged;
    }
    state.loaded = true;
    const snap = takeRenderSnapshot();
    if(snap !== lastRenderSnapshot){
      lastRenderSnapshot = snap;
      render();
    }
  }
 
  // ---------- round management ----------
  async function createRound(){
    const name = prompt('새 면접 회차의 이름을 입력해주세요 (예: 2026년 상반기 신입 공채 1차)', '');
    if(name === null) return; // 취소
    const finalName = name.trim() || `면접 회차 ${state.rounds.length + 1}`;
    let interviewerCount = 3;
    const countStr = prompt('이번 회차의 면접관 수를 입력해주세요 (2~5명, 보통은 3명)', '3');
    if(countStr !== null){
      const parsed = parseInt(countStr.trim(), 10);
      if(!isNaN(parsed) && parsed >= 2 && parsed <= 5) interviewerCount = parsed;
      else if(countStr.trim() !== '') alert('2~5 사이의 숫자가 아니어서 기본값 3명으로 설정했습니다.');
    }
    let scoringMode = 'dual';
    const modeStr = prompt(
      '이번 회차의 채점 기준을 선택해주세요.\n\n' +
      '1 = 직무적합도 + 조직적합도를 각각 평가 (기본)\n' +
      '2 = 등급 하나로만 종합평가 (예: 기자직처럼 단일 기준)',
      '1'
    );
    if(modeStr !== null && modeStr.trim() === '2') scoringMode = 'single';
    const id = 'r' + Date.now();
    const round = { id, name: finalName, createdAt: new Date().toISOString(), interviewerCount, scoringMode };
    state.rounds = [...state.rounds, round];
    state.activeRoundId = id;
    state.viewRoundId = id;
    state.candidates = [];
    state.scores = { A:{}, B:{}, C:{}, D:{}, E:{} };
    state.interviewerNames = { A:'', B:'', C:'', D:'', E:'' };
    state.revealed = false;
    render();
    await Promise.all([
      setShared('rounds', state.rounds),
      setShared('activeRoundId', id),
      setShared(roundKey(id,'candidates'), []),
      setShared(roundKey(id,'scores_A'), {}),
      setShared(roundKey(id,'scores_B'), {}),
      setShared(roundKey(id,'scores_C'), {}),
      setShared(roundKey(id,'scores_D'), {}),
      setShared(roundKey(id,'scores_E'), {}),
      setShared(roundKey(id,'revealed'), false),
      setShared(roundKey(id,'interviewerNames'), { A:'', B:'', C:'', D:'', E:'' }),
    ]);
  }
 
  // 면접관 본인의 실제 이름을 이번 회차에 저장. rid를 명시적으로 받아서, 관리자가 과거
  // 회차를 고쳐 적는 경우와 면접관이 진행 중인 회차에 적는 경우 모두 지원한다.
  async function setInterviewerName(rid, letter, name){
    state.interviewerNames[letter] = name;
    render();
    await setShared(roundKey(rid, 'interviewerNames'), state.interviewerNames);
  }
 
  async function switchViewRound(id){
    state.viewRoundId = id;

  }

    if(!confirm('이 회차를 다시 "진행 중"으로 전환하면, 면접관 화면이 이 회차 데이터로 바뀝니다. 계속할까요?')) return;
    state.activeRoundId = id;

  }
 
  // 회차를 이 웹앱의 회차 목록에서만 제거한다. round:<id>:candidates 등 구글 스프레드시트의
  // 실제 데이터는 그대로 남아있고, 단지 'rounds' 목록에서 참조가 빠져서 화면에 더 이상
  // 보이지 않게 될 뿐이다 (필요하면 시트에서 직접 확인 가능).
  async function deleteRoundFromList(id){
    const round = state.rounds.find(r => r.id === id);
    const isActive = id === state.activeRoundId;
    const warn = isActive
      ? `"${round ? round.name : ''}"은(는) 현재 진행 중인 회차입니다. 삭제하면 면접관 화면에 "진행 중인 회차 없음"으로 표시됩니다. 그래도 목록에서 삭제할까요? (스프레드시트의 실제 데이터는 삭제되지 않습니다)`
      : `"${round ? round.name : ''}" 회차를 목록에서 삭제할까요? 스프레드시트의 실제 데이터는 그대로 남고, 이 화면에서만 안 보이게 됩니다.`;
    if(!confirm(warn)) return;
 
    state.rounds = state.rounds.filter(r => r.id !== id);
    if(state.activeRoundId === id) state.activeRoundId = null;
    if(state.viewRoundId === id) state.viewRoundId = state.activeRoundId;
    render();
    await Promise.all([
      setShared('rounds', state.rounds),
      setShared('activeRoundId', state.activeRoundId),
    ]);
  }
 
  // ---------- excel parsing ----------
  // 실제 채용시스템(잡코리아 등) 내보내기 파일과, 이전에 쓰던 간단한 테스트 양식을
  // 둘 다 인식할 수 있도록 헤더 텍스트를 정확 매칭한다. 열의 "위치(순서)"는 매번
  // 달라질 수 있으므로 절대 위치가 아니라 헤더 문자열로만 판단한다.
  //
  // 주의: "대학" 하나로만 판단하면 "대학원"(대학교와 무관한 별도 학력)까지 university로
  // 잘못 잡히고, "이름" substring 판단은 "영문이름"/"한문이름"까지 걸려버리므로,
  // 여기서는 정확히 일치하는 헤더 문자열만 화이트리스트로 인정한다.
  const HEADER_EXACT_MAP = {
    examNo: ['수험번호','접수번호','응시번호'],
    name: ['이름','성명'],
    dob: ['생년월일','생일'],
    gender: ['성별'],
    age: ['나이'],
    university: ['최종졸업대학교명','대학','학교','출신대학'],
    department: ['최종졸업대학교전공','학과','전공','출신학과'],
    gradSchool1: ['대학원1-학교명','최종졸업대학원명'],
    gradMajor1: ['대학원1-전공명','최종졸업대학원전공'],
    gradDegree1: ['대학원1-학위구분'],
    gradSchool2: ['대학원2-학교명'],
    gradMajor2: ['대학원2-전공명'],
    gradDegree2: ['대학원2-학위구분'],
    // 실제 채용시스템 내보내기: 경력 여러 건이 한 셀에 줄바꿈(\n)으로 같이 들어있는 형태
    career_company_multi: ['경력사항-회사명'],
    career_type_multi: ['경력사항-고용형태'],
    career_period_multi: ['경력사항-재직일자'],
    career_department_multi: ['경력사항-부서명'],
  };
 
  function classifyColumn(header){
    const s = String(header||'').replace(/\s/g,'');
    for(const type in HEADER_EXACT_MAP){
      if(HEADER_EXACT_MAP[type].includes(s)) return { type };
    }
    // 이전에 쓰던 간단 양식 호환: 경력1 / 경력종류1(=경력1종류) / 경력기간1(=경력1기간)
    // 처럼 숫자로 여러 경력을 나눠 놓은 형태 (열마다 경력 1건씩)
    let m;
    if((m = s.match(/^경력종류(\d+)$/)) || (m = s.match(/^경력(\d+)종류$/))) return { type:'career_type', idx: parseInt(m[1],10) };
    if((m = s.match(/^경력기간(\d+)$/)) || (m = s.match(/^경력(\d+)기간$/))) return { type:'career_period', idx: parseInt(m[1],10) };
    if((m = s.match(/^경력(\d+)$/))) return { type:'career_company', idx: parseInt(m[1],10) };
    return null;
  }
 
  // 첫 몇 줄 중 실제 "헤더 행"이 어디인지 찾는다. 실제 채용시스템 파일은
  // 1행: 병합된 제목, 2행: 진짜 헤더, 3행: 1,2,3… 열 번호, 4행부터 데이터 — 이렇게
  // 되어 있어서 무조건 첫 행을 헤더로 보면 안 된다.
  function findHeaderRowIndex(rows){
    const limit = Math.min(rows.length, 8);
    for(let i=0;i<limit;i++){
      const row = rows[i];
      const nonEmpty = row.filter(v => String(v).trim() !== '');
      if(nonEmpty.length < 3) continue; // 셀이 거의 없으면 제목 행일 가능성이 큼
      const numericRatio = nonEmpty.filter(v => /^\d+$/.test(String(v).trim())).length / nonEmpty.length;
      if(numericRatio > 0.7) continue; // 1,2,3… 열 번호 행이면 건너뜀
      return i;
    }
    return 0;
  }
 
  function handleFile(file){
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
        if(rows.length < 2){ alert('엑셀에 데이터가 없습니다.'); return; }
 
        const headerRowIdx = findHeaderRowIndex(rows);
        const headers = rows[headerRowIdx];
        const cols = headers.map(classifyColumn);
        const hasName = cols.some(c => c && c.type === 'name');
 
        // 헤더 다음 행이 1,2,3… 같은 열 번호 행이면 그 행도 건너뛰고 그 다음부터 데이터로 본다.
        let dataStartIdx = headerRowIdx + 1;
        const nextRow = rows[dataStartIdx];
        if(nextRow){
          const nonEmpty = nextRow.filter(v => String(v).trim() !== '');
          const numericRatio = nonEmpty.length ? nonEmpty.filter(v => /^\d+$/.test(String(v).trim())).length / nonEmpty.length : 0;
          if(nonEmpty.length >= 3 && numericRatio > 0.7) dataStartIdx++;
        }
 
        const candidates = [];
        let seq = 0;
        for(let i=dataStartIdx;i<rows.length;i++){
          const row = rows[i];
          if(row.every(c => String(c).trim()==='')) continue;
          seq++;
          const rec = { examNo:'', name:'', dob:'', gender:'', university:'', department:'', age:'', gradSchool1:'', gradMajor1:'', gradDegree1:'', gradSchool2:'', gradMajor2:'', gradDegree2:'' };
          const careersMap = {};       // 이전 간단 양식(경력1, 경력2 …)용
          const multi = {};            // 실제 채용시스템(한 셀에 \n으로 여러 경력)용
          row.forEach((val, idx)=>{
            const col = cols[idx];
            const valStr = String(val ?? '').trim();
            if(!col) return; // 화이트리스트에 없는 열은 무시 (요청하신 항목만 사용)
            if(col.type === 'career_company'){
              if(!careersMap[col.idx]) careersMap[col.idx] = {};
              careersMap[col.idx].company = valStr;
            } else if(col.type === 'career_type'){
              if(!careersMap[col.idx]) careersMap[col.idx] = {};
              careersMap[col.idx].type = valStr;
            } else if(col.type === 'career_period'){
              if(!careersMap[col.idx]) careersMap[col.idx] = {};
              careersMap[col.idx].period = valStr;
            } else if(col.type === 'career_company_multi'){
              multi.company = valStr ? valStr.split(/\r?\n/) : [];
            } else if(col.type === 'career_type_multi'){
              multi.type = valStr ? valStr.split(/\r?\n/) : [];
            } else if(col.type === 'career_period_multi'){
              multi.period = valStr ? valStr.split(/\r?\n/) : [];
            } else if(col.type === 'career_department_multi'){
              multi.department = valStr ? valStr.split(/\r?\n/) : [];
            } else {
              rec[col.type] = valStr;
            }
          });
          if(!hasName){ rec.name = String(row[0] ?? '').trim(); }
          if(!rec.examNo){ rec.examNo = String(seq).padStart(3,'0'); } // 엑셀에 수험번호 열이 없으면 순번으로 자동 부여
 
          if(multi.company || multi.type || multi.period || multi.department){
            // 회사명 배열의 길이를 기준으로, 같은 인덱스의 값들을 하나의 경력으로 묶는다
            // (실제 파일에서 모든 경력 하위 열의 항목 수가 항상 일치함을 확인함).
            const n = (multi.company || []).length;
            rec.careers = Array.from({ length: n }, (_, idx) => ({
              idx,
              company: (multi.company && multi.company[idx]) || '',
              type: (multi.type && multi.type[idx]) || '',
              period: (multi.period && multi.period[idx]) || '',
              department: (multi.department && multi.department[idx]) || '',
            })).filter(c => !isBlankValue(c.company) || !isBlankValue(c.type));
          } else {
            // 경력1이 가장 최근 경력이므로 idx 오름차순 = 최신순으로 정렬
            rec.careers = Object.keys(careersMap)
              .map(k => ({ idx: parseInt(k,10), ...careersMap[k] }))
              .filter(c => !isBlankValue(c.company) || !isBlankValue(c.type))
              .sort((a,b) => a.idx - b.idx);
          }
          rec.id = 'c' + i + '_' + (rec.name||'').replace(/\s/g,'').slice(0,6) + '_' + Math.random().toString(36).slice(2,6);
          candidates.push(rec);
        }
        if(candidates.length === 0){ alert('인식할 수 있는 지원자 행이 없습니다.'); return; }
 
        if(state.candidates.length > 0){
          if(!confirm(`이미 ${state.candidates.length}명의 지원자 데이터가 있습니다. 새로 업로드한 ${candidates.length}명으로 덮어쓰면 기존 채점 결과와 매칭이 깨질 수 있습니다. 계속할까요?`)) return;
        }
        state.candidates = candidates;
        render();
        const rid = currentRoundId();
        const ok = await setShared(roundKey(rid,'candidates'), candidates);
        if(!ok){
          showToast('저장에 실패했습니다. 네트워크 상태를 확인하고 다시 업로드해주세요.');
        }
      }catch(err){
        console.error(err);
        alert('엑셀 파일을 읽는 중 문제가 발생했습니다. 파일 형식을 확인해주세요.');
      }
    };
    reader.readAsArrayBuffer(file);
  }
 
  async function resetAll(){
    if(!confirm('이번 회차의 모든 지원자 정보와 채점 결과, 공개 상태가 초기화됩니다. 계속할까요?')) return;
    const rid = currentRoundId();
    state.candidates = [];
    state.scores = { A:{}, B:{}, C:{}, D:{}, E:{} };
    state.revealed = false;
    await Promise.all([
      setShared(roundKey(rid,'candidates'), []),
      setShared(roundKey(rid,'scores_A'), {}),
      setShared(roundKey(rid,'scores_B'), {}),
      setShared(roundKey(rid,'scores_C'), {}),
      setShared(roundKey(rid,'scores_D'), {}),
      setShared(roundKey(rid,'scores_E'), {}),
      setShared(roundKey(rid,'revealed'), false),
    ]);
    render();
  }
 
  async function toggleReveal(){
    const rid = currentRoundId();
    state.revealed = !state.revealed;
    render();
    await setShared(roundKey(rid,'revealed'), state.revealed);
  }
 
  async function setScore(letter, candidateId, field, grade){
    const rid = state.activeRoundId; // 면접관은 항상 현재 진행 중인 회차에 채점
    if(!state.scores[letter][candidateId]) state.scores[letter][candidateId] = {};
    state.scores[letter][candidateId][field] = grade;
    render();
    // Save quietly in the background. setShared already retries a few times on its own;
    // we deliberately don't pop up a warning here — the input is already reflected on
    // screen, and premature "did it really save?" re-checks were themselves the source
    // of false-alarm popups. loadAll()'s poll will simply keep syncing in the background.
    await setShared(roundKey(rid, 'scores_' + letter), state.scores[letter]);
  }
 
  // ---------- toast (non-blocking notification) ----------
  function showToast(msg){
    let container = document.getElementById('toastContainer');
    if(!container){
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.className = 'toast-container';
      document.body.appendChild(container);
    }
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    container.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 3500);
  }
 
  // ---------- calc ----------
  function ownAvg(letter, candidateId){
    const s = state.scores[letter][candidateId];
    if(!s) return null;
    if(getScoringMode(currentRoundId()) === 'single'){
      // 단일평가 모드: 등급 하나(job 필드에 저장)만으로 판단, 평균 낼 필요 없음
      if(!s.job) return null;
      return GRADE_MAP[s.job];
    }
    if(!s.job || !s.culture) return null;
    return (GRADE_MAP[s.job] + GRADE_MAP[s.culture]) / 2;
  }
 
  // Standard "1-2-2-4" competition ranking: candidates with an equal score share the
  // same rank, and the next distinct (lower) score skips ahead to its true position —
  // e.g. scores [100, 99, 99, 98] over 10 people become ranks [1, 2, 2, 4].
  // `list` must already be sorted descending by scoreOf(item).
  function assignStandardRanks(list, scoreOf){
    let rank = 0;
    let prevScore = null;
    return list.map((item, i) => {
      const score = scoreOf(item);
      if(prevScore === null || score !== prevScore){ rank = i + 1; }
      prevScore = score;
      return { ...item, rank };
    });
  }
 
  function computeOwnRanking(letter){
    const list = state.candidates
      .map(c => ({ c, avg: ownAvg(letter, c.id) }))
      .filter(x => x.avg !== null)
      .sort((a,b)=> b.avg - a.avg);
    return assignStandardRanks(list, x => x.avg);
  }
 
  // Map of candidateId -> { rank, total } among everyone this interviewer has finished scoring.
  function computeOwnRankMap(letter){
    const ranking = computeOwnRanking(letter);
    const map = {};
    ranking.forEach(r => { map[r.c.id] = { rank: r.rank, total: ranking.length }; });
    return map;
  }
 
  function computeFinal(){
    const letters = activeInterviewerLetters(currentRoundId());
    const all = state.candidates.map(c=>{
      const per = letters.map(k => ownAvg(k, c.id));
      const jobs = letters.map(k => {
        const s = state.scores[k][c.id];
        return (s && s.job) ? GRADE_MAP[s.job] : null;
      });
      const cultures = letters.map(k => {
        const s = state.scores[k][c.id];
        return (s && s.culture) ? GRADE_MAP[s.culture] : null;
      });
      const jobGrades = letters.map(k => {
        const s = state.scores[k][c.id];
        return (s && s.job) ? s.job : null;
      });
      const cultureGrades = letters.map(k => {
        const s = state.scores[k][c.id];
        return (s && s.culture) ? s.culture : null;
      });
      const memos = letters.map(k => {
        const s = state.scores[k][c.id];
        return (s && s.memo && s.memo.trim()) ? s.memo.trim() : '';
      });
      const doneCount = per.filter(v=>v!==null).length;
      const total = per.reduce((a,b)=> a + (b||0), 0);
      const jobTotal = jobs.reduce((a,b)=> a + (b||0), 0);
      const cultureTotal = cultures.reduce((a,b)=> a + (b||0), 0);
      return { c, per, jobs, cultures, jobGrades, cultureGrades, memos, total, jobTotal, cultureTotal, complete: doneCount===letters.length, doneCount };
    }).sort((a,b)=> b.total - a.total);
    const complete = assignStandardRanks(all.filter(r=>r.complete), r => r.total);
    const incomplete = all.filter(r=>!r.complete);
    return { complete, incomplete };
  }
 
  function fmt(n){ return n===null || n===undefined ? '-' : n.toFixed(1); }
 
  function filteredCandidates(){
    if(!state.filter.trim()) return state.candidates;
    const q = state.filter.trim();
    return state.candidates.filter(c => (c.name||'').includes(q) || (c.examNo||'').includes(q));
  }
 
  // ---------- render ----------
  function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
 
  const ROLE_LABELS = { admin:'관리자', A:'면접관 A', B:'면접관 B', C:'면접관 C', D:'면접관 D', E:'면접관 E' };
 
  // 관리자 전용 "개발 기록" — 이 프로그램에 어떤 기능이 언제 추가/수정/제거되었는지 기록.
  // 새 기능을 추가하거나 고칠 때마다, 맨 위에 새 날짜 항목을 추가해주세요 (최신순).

  // 형식으로 기록. 이 시스템이 대화가 진행되며 어떻게 변화해왔는지를 시간순으로 보여주는 게
  // 목적이므로, 새 기능/수정이 생길 때마다 맨 아래에 새 업데이트 항목을 추가해주세요.
  const CHANGELOG = [

  // Wrapper around the real render so that whatever text input the user is actively
  // typing into — the interviewer name field, the search box, a PIN code field, admin
  // name/code inputs, etc. — never gets interrupted or reset by a re-render, whether
  // that render was triggered by the 3-second background sync or by any other action.
  // This was the root cause behind "Korean won't type" / "input cuts off after a few
  // characters": a full-page rebuild was recreating the input mid-keystroke (or mid-IME
  // composition) with its old, unsaved value.
  function render(){
    const active = document.activeElement;
    let restore = null;
    if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.id){
      restore = {
        id: active.id,
        value: active.value,
        selStart: active.selectionStart,
        selEnd: active.selectionEnd,
      };
    }
    renderInner();
    if(restore){
      const revived = document.getElementById(restore.id);
      if(revived && (revived.tagName === 'INPUT' || revived.tagName === 'TEXTAREA')){
        revived.value = restore.value;
        revived.focus();
        try{ revived.setSelectionRange(restore.selStart, restore.selEnd); }catch(e){}
      }
    }
    // Keep the background-poll dirty-check in sync with whatever just got rendered
    // (whether triggered by a direct user action or by loadAll), so the next poll only
    // re-renders if something has genuinely changed since this point.
    lastRenderSnapshot = takeRenderSnapshot();
  }

  async function savePin(role, value, btnEl){
    if(value.length !== 4){
      showToast('코드는 4자리 숫자로 입력해주세요.');
      return;
    }
    const prevLabel = btnEl.textContent;
    btnEl.textContent = '저장 중…';
    btnEl.disabled = true;
    state.pins[role] = value;
    const ok = await setShared('pins', state.pins);
    btnEl.disabled = false;
    btnEl.textContent = prevLabel;
    if(ok){ showToast(`${ROLE_LABELS[role]} 코드가 변경되었습니다.`); }
    else{ showToast('코드 저장에 실패했습니다. 다시 시도해주세요.'); }
  }

    finalCard.querySelector('#finalTableWrap').appendChild(buildFinalTable());
    finalCard.querySelector('#exportExcelBtn').addEventListener('click', exportFinalResultsToExcel);
    wrap.appendChild(finalCard);
 
    return wrap;
  }
 
  function interviewerLabel(letter){
    const name = state.interviewerNames[letter];
    return name ? `면접관 ${letter} · ${name}` : `면접관 ${letter}`;
  }
 
  // 경력 목록을 엑셀 셀 하나에 넣기 좋은 한 줄 텍스트로 변환 (예: "1. 삼성전자 계약직 (2024.01~2024.12) / 2. ...")
  // 저장된 careers 배열은 파일에 나온 순서(대개 최신순) 그대로다. 화면에는 "경력1이 가장
  // 오래된(처음 쌓은) 경력"이 되도록 뒤집어서 보여준다 — 예: 2000년 경력이 경력1, 2013년
  // 경력이 경력2.
  function orderedCareersOldestFirst(c){
    return (c.careers || []).slice().reverse();
  }
 
  function careerToText(c){
    const careers = orderedCareersOldestFirst(c);
    if(careers.length === 0) return c.otherInfo || '';
    return careers.map((entry, i)=>{
      const { name, period: embeddedPeriod } = splitCompanyPeriod(entry.company);
      const period = entry.period || embeddedPeriod;
      const parts = [name, entry.type].filter(Boolean).join(' ');
      return `경력${i+1}: ${parts}${period ? ' ('+period+')' : ''}`;
    }).join(' / ');
  }
 
  function exportFinalResultsToExcel(){
    const { complete, incomplete } = computeFinal();
    const letters = activeInterviewerLetters(currentRoundId());
    const labels = letters.map(l => interviewerLabel(l));
    const maxScore = letters.length * 100;
    const scoreTotalKey = `종합점수(${maxScore}점)`;
    const scoringMode = getScoringMode(currentRoundId());
 
    function baseFields(c){
      return {
        '수험번호': c.examNo || '',
        '이름': c.name || '',
        '생년월일': c.dob || '',
        '성별': c.gender || '',
        '나이': c.age || '',
        '출신대학': c.university || '',
        '출신학과': c.department || '',
        '경력': careerToText(c),
      };
    }
 
    const rows = complete.map(r => {
      const row = { '순위': r.rank, ...baseFields(r.c) };
      labels.forEach((label, i)=>{
        if(scoringMode === 'single'){
          row[`${label} 평가 등급`] = r.jobGrades[i]!=null ? r.jobGrades[i] : '';
          row[`${label} 평가 점수`] = r.jobs[i]!=null ? r.jobs[i] : '';
        } else {
          row[`${label} 조직적합도 등급`] = r.cultureGrades[i]!=null ? r.cultureGrades[i] : '';
          row[`${label} 조직적합도 점수`] = r.cultures[i]!=null ? r.cultures[i] : '';
          row[`${label} 직무적합도 등급`] = r.jobGrades[i]!=null ? r.jobGrades[i] : '';
          row[`${label} 직무적합도 점수`] = r.jobs[i]!=null ? r.jobs[i] : '';
          row[`${label} 소계`] = r.per[i]!=null ? r.per[i] : '';
        }
        row[`${label} 메모`] = r.memos[i] || '';
      });
      row[scoreTotalKey] = r.total;
      return row;
    });
    incomplete.forEach(r=>{
      const row = { '순위': '-', ...baseFields(r.c) };
      labels.forEach(label=>{
        if(scoringMode === 'single'){
          row[`${label} 평가 등급`] = '';
          row[`${label} 평가 점수`] = '';
        } else {
          row[`${label} 조직적합도 등급`] = '';
          row[`${label} 조직적합도 점수`] = '';
          row[`${label} 직무적합도 등급`] = '';
          row[`${label} 직무적합도 점수`] = '';
          row[`${label} 소계`] = '';
        }
        row[`${label} 메모`] = '';
      });
      row[scoreTotalKey] = `평가 진행 중 (${r.doneCount}/${letters.length}명 완료)`;
      rows.push(row);
    });
    if(rows.length === 0){
      alert('내보낼 지원자 데이터가 없습니다.');
      return;
    }
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '최종순위');
    const roundName = (state.rounds.find(rd => rd.id === currentRoundId()) || {}).name || '면접결과';
    const safeName = roundName.replace(/[\\/:*?"<>|]/g, '_');
    XLSX.writeFile(wb, `${safeName}_최종순위.xlsx`);
  }
 
  function interviewerScoreBlock(label, culture, cultureGrade, job, jobGrade, subtotal, memo, mode){
    const memoHtml = memo ? `<div class="iv-memo">"${escapeHtml(memo)}"</div>` : '';
    const scoreLineHtml = mode === 'single'
      ? `<span title="종합평가">평가 ${jobGrade!=null ? escapeHtml(jobGrade)+'('+job+')' : '-'}</span>`
      : `<span title="조직적합도">조직 ${cultureGrade!=null ? escapeHtml(cultureGrade)+'('+culture+')' : '-'}</span>
         <span title="직무적합도">직무 ${jobGrade!=null ? escapeHtml(jobGrade)+'('+job+')' : '-'}</span>`;
    return `<div class="iv-score-block">
      <div class="cell-label">${escapeAttr(label)}</div>
      <div class="score-cell-grid">
        ${scoreLineHtml}
      </div>
      <span class="avg-pill" style="margin-top:3px;display:inline-block;">${subtotal!=null ? fmt(subtotal)+'점' : '평가중'}</span>
      ${memoHtml}
    </div>`;
  }
 
  // 카드 우측에 통째로 붙는 등수 사이드바. 무조건 한 줄로만 나오도록 함(줄바꿈 금지).
  // 지원자 카드가 수십~수백 개일 때 한꺼번에 다 그리면 느려지므로, 처음엔 일부만 보여주고
  // "더 보기"를 눌러야 나머지가 그려지도록 하는 공용 페이지네이션 헬퍼.
  const LIST_PAGE_SIZE = 20;
  function getVisibleCount(key, total){
    const shown = state.visibleCounts[key] || LIST_PAGE_SIZE;
    return Math.min(shown, total);
  }
  function buildShowMoreBtn(key, shownCount, total){
    if(shownCount >= total) return null;
    const remaining = total - shownCount;
    const btn = el(`<button class="btn btn-teal" style="width:100%;margin-top:2px;">더 보기 (${shownCount}/${total}명 표시 중 · ${Math.min(LIST_PAGE_SIZE, remaining)}명 더 보기)</button>`);
    btn.addEventListener('click', ()=>{
      state.visibleCounts[key] = shownCount + LIST_PAGE_SIZE;
      render();
    });
    return btn;
  }
 
  function rankSideHtml(rank, total){
    if(rank == null){
      return `<div class="rank-side-empty">평가중</div>`;
    }
    return `<div class="rank-side-num">${rank}등<span class="rank-side-slash"> / </span>${total}명</div>`;
  }
 
  function candidateCardTop(c, i){
    return `
      <div class="cand-head">
        <div class="cand-id">
          <div class="cand-name-row">
            <span class="cand-seq">${i+1}</span>
            <span class="cand-name">${escapeHtml(c.name)}</span>
            <span class="cand-examno">${escapeHtml(c.examNo||'-')}</span>
          </div>
          <div class="cand-vitals">${escapeHtml(c.dob||'-')} · ${escapeHtml(c.gender||'-')}${c.age ? ' · '+escapeHtml(c.age) : ''}</div>
        </div>
      </div>
      <div class="cand-body">
        <div class="tag-row">${renderInfoTagsRow(c)}</div>
        <div class="career-row">${renderCareerChips(c)}</div>
      </div>`;
  }
 
  function buildFinalTable(){
    const { complete, incomplete } = computeFinal();
    const letters = activeInterviewerLetters(currentRoundId());
    const labels = letters.map(l => interviewerLabel(l));
    const maxScore = letters.length * 100;
    const scoringMode = getScoringMode(currentRoundId());
 
    if(!complete.length && !incomplete.length){
      return el(`<div class="empty-state">등록된 지원자가 없습니다.</div>`);
    }
 
    const builders = [];
    complete.forEach((r, i)=>{
      builders.push(()=>{
        const scoreBlocks = letters.map((l, idx) =>
          interviewerScoreBlock(labels[idx], r.cultures[idx], r.cultureGrades[idx], r.jobs[idx], r.jobGrades[idx], r.per[idx], r.memos[idx], scoringMode)
        ).join('');
        return el(`<div class="candidate">
          <div class="cand-main">
            ${candidateCardTop(r.c, i)}
            <div class="divider"></div>
            <div class="score-zone score-zone-final" style="align-items:stretch;">
              ${scoreBlocks}
              <div class="score-result">
                <div class="avg">${r.total.toFixed(1)}</div>
                <div class="rank">종합점수 (${maxScore}점)</div>
              </div>
            </div>
          </div>
          <div class="cand-rank-side">${rankSideHtml(r.rank, complete.length)}</div>
        </div>`);
      });
    });
    incomplete.forEach((r, i)=>{
      builders.push(()=>{
        return el(`<div class="candidate">
          <div class="cand-main">
            ${candidateCardTop(r.c, complete.length + i)}
            <div class="divider"></div>
            <div class="score-zone">
              <span class="sub-cell">평가 진행 중 (${r.doneCount}/${letters.length}명 완료)</span>
            </div>
          </div>
          <div class="cand-rank-side">${rankSideHtml(null, 0)}</div>
        </div>`);
      });
    });
 
    const wrap = document.createElement('div');
    const pageKey = `final_${currentRoundId()}`;
    const shownCount = getVisibleCount(pageKey, builders.length);
    builders.slice(0, shownCount).forEach(fn => wrap.appendChild(fn()));
    const moreBtn = buildShowMoreBtn(pageKey, shownCount, builders.length);
    if(moreBtn) wrap.appendChild(moreBtn);
    return wrap;
  }

      : '직무적합도 · 조직적합도를 각각 등급으로 입력하면 자동으로 환산됩니다 (A=100, B+=95, B=90, C=80, D=70, E=0)';

    const moreBtn = buildShowMoreBtn(pageKey, shownCount, list.length);
    if(moreBtn) wrap.appendChild(moreBtn);

  function renderGradeLegend(){
    const items = Object.entries(GRADE_DEFINITIONS).map(([grade, def])=>{
      return `<div class="grade-legend-item">
        <span class="grade-legend-badge">${escapeHtml(grade)}</span>
        <span class="grade-legend-def">${escapeHtml(def)}</span>
      </div>`;
    }).join('');
    return `<div class="grade-legend">${items}</div>`;
  }
 
  function buildGradeSelect(current, onChange){
    const sel = el(`<select class="grade-select">
      <option value="">-</option>
      ${GRADES.map(g=>`<option value="${g}" ${g===current?'selected':''}>${g}</option>`).join('')}
    </select>`);
    sel.addEventListener('change', (e)=>{ if(e.target.value) onChange(e.target.value); });
    return sel;
  }
 
  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }
 
  // Renders a candidate's structured career list (경력1/경력종류1/경력기간1 …) as clean,
  // numbered entries instead of one run-on line — most recent (경력1) first.
  // "중앙일보(2024.06.11~2025.08.09)" 처럼 회사명 칸에 기간이 괄호로 같이 들어있는 경우,
  // 이름과 기간을 분리해서 종류를 사이에 끼워넣을 수 있도록 한다.
  function splitCompanyPeriod(raw){
    const s = String(raw||'').trim();
    const m = s.match(/^(.*?)[\(（]([^\)）]*)[\)）]\s*$/);
    if(m) return { name: m[1].trim(), period: m[2].trim() };
    return { name: s, period: '' };
  }
 
  // 기본정보(생년월일/성별/나이 · 대학/전공 · 대학원/전공)를 여러 표에서 동일하게 표시하기
  // 위한 공통 렌더러. 대학원 정보는 있을 때만 한 줄 추가로 보여준다.
  // 채용시스템 원본 파일은 "해당없음"을 종종 빈 문자열 대신 하이픈(-)으로 채워 넣는다.
  // 그대로 두면 "-"가 마치 실제 값인 것처럼 표시되므로, 빈 값으로 간주해 걸러낸다.
  function isBlankValue(v){
    const s = String(v ?? '').trim();
    return s === '' || s === '-';
  }
 
  // "주전공 : 국문학과(...)\n복수전공 : 철학과(...)" 형태의 텍스트를 주전공/복수전공으로 분리.
  // 접두어가 없으면 통째로 주전공으로 취급한다.
  function parseMajorText(raw){
    if(isBlankValue(raw)) return { major:'', doubleMajor:'', minor:'' };
    const lines = String(raw).split(/\n/).map(s=>s.trim()).filter(Boolean);
    let major = '', doubleMajor = '', minor = '';
    lines.forEach(line=>{
      const m = line.match(/^(주전공|복수전공|부전공)\s*[:：]\s*(.*)$/);
      if(m){
        if(m[1] === '주전공') major = m[2].trim();
        else if(m[1] === '복수전공') doubleMajor = m[2].trim();
        else if(m[1] === '부전공') minor = m[2].trim();
      } else if(!major){
        major = line;
      }
    });
    return { major, doubleMajor, minor };
  }
 
  // 노션처럼, 라벨을 작은 색깔 사각형 태그로 값 앞에 붙여서 표시.
  // 카드형 지원자 UI: 학사/석사/박사 정보를 알약 모양 태그로 압축 표시.
  function renderInfoTagsRow(c){
    const tags = [];
    const tag = (text, color) => `<span class="tag"><span class="tag-dot" style="background:${color};"></span>${escapeHtml(text)}</span>`;
 
    if(!isBlankValue(c.university)){
      const { major, doubleMajor, minor } = parseMajorText(c.department);
      tags.push(tag(`학사 대학교 · ${c.university}`, 'var(--teal)'));
      if(major) tags.push(tag(`학사 주전공 · ${major}`, 'var(--teal)'));
      if(doubleMajor) tags.push(tag(`학사 복수전공 · ${doubleMajor}`, 'var(--teal)'));
      if(minor) tags.push(tag(`학사 부전공 · ${minor}`, 'var(--teal)'));
    }
    [
      { school: c.gradSchool1, major: c.gradMajor1, degree: c.gradDegree1 },
      { school: c.gradSchool2, major: c.gradMajor2, degree: c.gradDegree2 },
    ].forEach(grad => {
      if(isBlankValue(grad.school)) return;
      const degreeLabel = /박사/.test(grad.degree||'') ? '박사' : '석사';
      const color = degreeLabel === '박사' ? 'var(--ink)' : 'var(--amber)';
      const { major: gm } = parseMajorText(grad.major);
      tags.push(tag(`${degreeLabel} 대학원 · ${grad.school}`, color));
      if(gm) tags.push(tag(`${degreeLabel} 전공 · ${gm}`, color));
    });
    return tags.join('');
  }
 
  // 카드형 지원자 UI: 경력을 가로로 넘겨볼 수 있는 칩으로, "경력1"이 가장 오래된(처음 쌓은)
  // 경력이 되도록 과거순으로 번호를 매긴다.
  // "2024.02.26 ~ 2026.01.30" 같은 기간 텍스트에서 근무 개월수를 계산해서
  // "1년 11개월" 형태로 반환. 날짜를 못 읽으면 빈 문자열을 반환.
  function parseCareerDate(s){
    const m = String(s||'').trim().match(/^(\d{4})[.\-\/](\d{1,2})(?:[.\-\/](\d{1,2}))?/);
    if(!m) return null;
    return { y: parseInt(m[1],10), mo: parseInt(m[2],10), d: m[3] ? parseInt(m[3],10) : 1 };
  }
  function calcDurationLabel(periodStr){
    if(isBlankValue(periodStr)) return '';
    const parts = String(periodStr).split(/[~～]/).map(s=>s.trim()).filter(Boolean);
    const start = parseCareerDate(parts[0]);
    if(!start) return '';
    let end = parts[1] ? parseCareerDate(parts[1]) : null;
    if(!end){
      const now = new Date();
      end = { y: now.getFullYear(), mo: now.getMonth()+1, d: now.getDate() };
    }
    let months = (end.y - start.y) * 12 + (end.mo - start.mo);
    if(end.d < start.d) months -= 1;
    if(months < 0 || isNaN(months)) return '';
    if(months === 0) months = 1; // 같은 달 입·퇴사 등은 최소 1개월로 표시
    const years = Math.floor(months / 12);
    const rem = months % 12;
    if(years === 0) return `${months}개월`;
    return rem > 0 ? `${years}년 ${rem}개월` : `${years}년`;
  }
 
  function renderCareerChips(c){
    const careers = orderedCareersOldestFirst(c);
    if(careers.length === 0){
      return `<div class="career-chip empty"><div class="co" style="color:var(--muted);">경력 없음</div></div>`;
    }
    return careers.map((entry, i)=>{
      const { name, period: embeddedPeriod } = splitCompanyPeriod(entry.company);
      const period = !isBlankValue(entry.period) ? entry.period : embeddedPeriod;
      const metaParts = [];
      if(!isBlankValue(entry.department)) metaParts.push(escapeHtml(entry.department));
      if(!isBlankValue(entry.type)) metaParts.push(escapeHtml(entry.type));
      const metaLine1 = metaParts.join(' · ');
      const durationLabel = calcDurationLabel(period);
      const periodLine = !isBlankValue(period) ? escapeHtml(period) : '';
      const durationLine = durationLabel ? `<span style="color:var(--teal);font-weight:700;white-space:nowrap;">(${durationLabel})</span>` : '';
      return `<div class="career-chip">
        <div class="chip-ordinal">경력${i+1}</div>
        <div class="co">${!isBlankValue(name) ? escapeHtml(name) : '-'}</div>
        <div class="meta">${[metaLine1, periodLine, durationLine].filter(Boolean).join('<br>')}</div>
      </div>`;
    }).join('');
  }
 
  // ---------- boot ----------
  loadAll();
  setInterval(loadAll, 3000);
})();
</script>
</body>
</html>
